<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1033">
<title>The Village</title>
<style>
html{background:#07101f}
body{margin:0;font-family:Georgia,'Times New Roman',serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#c{position:fixed;top:0;left:50%;transform:translateX(-50%);display:block;touch-action:pan-y;will-change:clip-path}
#spacer{width:1px}
#cap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:max-content;max-width:min(86vw,340px);text-align:center;color:#fff;background:rgba(9,14,44,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:9px 16px 11px;border-radius:16px;pointer-events:none;transition:opacity .8s;line-height:1.3;border:1px solid rgba(247,227,161,.25)}
#cap b{display:block;font-weight:normal;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#f7e3a1;margin-bottom:2px;font-family:ui-monospace,Menlo,monospace}
#cap span{font-size:16px;font-style:italic}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);color:#f7e3a1;font:12px ui-monospace,Menlo,monospace;letter-spacing:.2em;opacity:0;transition:opacity 1s;pointer-events:none;text-shadow:0 1px 6px #0a1033;animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translate(-50%,6px)}}
#dev{position:fixed;top:0;left:0;right:0;display:none;gap:6px 12px;flex-wrap:wrap;align-items:center;padding:7px 10px;background:rgba(6,12,24,.86);color:#e9f3ee;font:11px ui-monospace,Menlo,monospace;z-index:5}
#dev.on{display:flex}
#dev button,#dev select{font:inherit;color:#0f2a20;background:#f7e3a1;border:0;border-radius:6px;padding:5px 8px;cursor:pointer}
#dev input[type=range]{width:120px;vertical-align:middle;accent-color:#e8c56a}
#dev label{white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="spacer"></div>
<div id="hint">SCROLL ↓</div>
<div id="cap"><b id="capD"></b><span id="capT"></span></div>
<div id="dev">
  <button id="bPlay">▶ Time-lapse</button>
  <label>Day <input type="range" id="rDay" min="0" max="22" step="1"> <span id="lDay"></span></label>
  <label>Time <input type="range" id="rHour" min="0" max="23.75" step=".25"> <span id="lHour"></span></label>
  <label>Speed <select id="sSpd"><option value="3">3s / day</option><option value="6" selected>6s / day</option><option value="12">12s / day</option><option value="24">24s / day</option></select></label>
  <label><input type="checkbox" id="cFollow" checked> follow what's new</label>
  <button id="bLive">Live (today)</button>
  <button id="bIntro">Replay intro</button>
  <button id="bHide" title="Hide this bar (reload to bring it back)">✕</button>
</div>
<script>
/* ================= SETTINGS =================
   The season starts on this date each year and runs through Jan 1.
   The story has 22 beats that END on Jan 1 (so beat 1 lands on Dec 11).
   Start earlier (e.g. Dec 1) and the extra early days show beat 1 until more beats are written. */
const CFG = { startMonth: 12, startDay: 11, lingerDays: 6 };
const STEPS = 22;
const STORY = [
  "The village is resting. Come back in December.",
  "A quiet summit. One pine. Something is about to begin.",
  "Fresh tracks in the snow. Someone built a cabin overnight.",
  "The stove is lit. Look up tonight: the Geminids are falling.",
  "More shooting stars. And the start of… something round.",
  "A neighbor has moved in down the slope. The snowman grows.",
  "He's finished! Carrot nose and all. (Give him a tap.)",
  "Lights go up along the cabin roof.",
  "The summit pine gets its lights.",
  "A red cottage, lamps along the path, a train on the far viaduct. It's becoming a village.",
  "Ornaments on the pine, and a bakery opens. One bauble looks familiar…",
  "Winter solstice. A chapel, the longest night, and the sky is dancing.",
  "The pond in the valley is frozen solid. Skates on!",
  "A star for the top of the pine, and a cable car to go and see it.",
  "Christmas Eve. Every roof is lit. Keep an eye on the moon tonight.",
  "Merry Christmas! Presents under the pine, and sleds all the way down.",
  "Leftovers, naps, and one very good snow dog.",
  "Visitors from the woods. The bird has claimed the hat.",
  "Lanterns line the path from the valley to the summit.",
  "A bonfire by the pond. Everyone's invited.",
  "Wish lanterns drift up past every window.",
  "New Year's Eve. Stay up for the fireworks.",
  "Happy New Year! See you next December."
];
const WEATHER = [0,.45,.3,.04,.04,.6,.4,.3,.5,.85,.4,.04,.3,.5,.35,.7,.3,.2,.5,.3,.12,.06,.3];   // snowfall per beat
const FOCUS   = [300,300,560,560,680,760,680,560,330,930,1100,300,1640,330,260,440,700,900,1000,1600,1450,1150,1560]; // where "today's new thing" is

/* ================= helpers ================= */
const $ = id => document.getElementById(id), q = new URLSearchParams(location.search);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hex = h => [1,3,5].map(i=>parseInt(h.substr(i,2),16));
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), R=Math.random, PI=Math.PI, ease=t=>t<.5?2*t*t:1-(-2*t+2)**2/2;
const rgba=(c,a=1)=>`rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
const mixc=(a,b,t)=>a.map((v,i)=>lerp(v,b[i],t));
const W=400, H=1900;

/* ================= season / clock ================= */
function season(d){
  const y = d.getMonth()===0 ? d.getFullYear()-1 : d.getFullYear();
  const start = new Date(y, CFG.startMonth-1, CFG.startDay), jan1 = new Date(y+1,0,1);
  const today = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const toJan = Math.round((jan1-today)/864e5);
  if (today<start || toJan < -CFG.lingerDays) return {step:0, year:(today<start?y:y+1)+1};
  return {step:clamp(STEPS-toJan,1,STEPS), year:y+1};
}
const preview = q.has('preview') || location.protocol==='file:' || /^(localhost|127\.|192\.168\.)/.test(location.hostname);
let mode='live', mStep=1, mHour=18, simT=15/24, spd=+q.get('speed')||6, follow=true;
if (q.has('day')) { mode='manual'; mStep=clamp(+q.get('day')||0,0,STEPS); mHour=q.has('hour')?+q.get('hour'):18; }
if (q.has('play')) mode='play';
const YEAR = season(new Date()).year;
function current(){
  if (mode==='live'){ const d=new Date(), s=season(d); return {step:s.step, hour:q.has('hour')?+q.get('hour'):d.getHours()+d.getMinutes()/60, year:s.year, live:true}; }
  if (mode==='manual') return {step:mStep, hour:mHour, year:YEAR};
  return {step:clamp(Math.floor(simT-7/24)+1,1,STEPS), hour:(simT%1)*24, year:YEAR};   // in time-lapse, new things appear at dawn
}
const stepDate = (step,year) => new Date(year,0,1-(STEPS-step));

/* ================= canvas / layout ================= */
const cv=$('c'), X=cv.getContext('2d');
let s=1, dpr=1, px=0, colW=0, ch=0, viewH=866, uMax=1000, u=0;
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
function fit(){
  ch=innerHeight; colW=Math.min(innerWidth,Math.round(ch*.62)); s=colW/W; dpr=Math.min(devicePixelRatio||1,2); viewH=ch/s; uMax=Math.max(1,H-viewH);
  cv.style.width=colW+'px'; cv.style.height=ch+'px'; cv.width=Math.round(colW*dpr); cv.height=Math.round(ch*dpr); $('spacer').style.height=(H*s)+'px';
  if(Math.abs(px-s*dpr)>1e-6){ px=s*dpr; staticBuilt=false; builtStep=-1; }
}
addEventListener('resize',()=>fit());

/* ================= sky colours ================= */
const NIGHT=['#050a24','#111c52','#2c3272',1,[.40,.47,.80],1], DAY=['#3f8fe0','#93c8f4','#e6f4ff',0,[1,1,1],0];
const SKY=[[0,...NIGHT],[6.2,...NIGHT],[7.3,'#3a5596','#e9a0a6','#ffd2a0',.1,[.86,.78,.86],.5],[8.6,...DAY],[15.6,...DAY],
           [16.7,'#35539f','#e58c8a','#ffc289',.1,[.93,.78,.80],.45],[17.6,'#0d1648','#4a4f8f','#d07f9c',.7,[.62,.62,.90],.85],[18.8,...NIGHT],[24,...NIGHT]];
let T=[1,1,1], night=0, starA=0, skyC=[[0,0,0],[0,0,0],[0,0,0]], haze=[0,0,0], tintKey='';
function setSky(hour){
  let i=0; while(i<SKY.length-2 && hour>=SKY[i+1][0]) i++;
  const a=SKY[i], b=SKY[i+1], t=clamp((hour-a[0])/(b[0]-a[0]),0,1);
  skyC=[1,2,3].map(k=>mixc(hex(a[k]),hex(b[k]),t)); starA=lerp(a[4],b[4],t); T=a[5].map((v,j)=>lerp(v,b[5][j],t)); night=lerp(a[6],b[6],t);
  haze=mixc(skyC[1],skyC[2],.55);
  const key=T.map(v=>v.toFixed(2)).join()+haze.map(v=>v>>2).join(); if(key!==tintKey){tintKey=key; retint();}
}
const tc=(h,a=1)=>{const c=hex(h);return `rgba(${Math.round(c[0]*T[0])},${Math.round(c[1]*T[1])},${Math.round(c[2]*T[2])},${a})`};

/* ================= sprites ================= */
const SPR={}; function glowS(col){ if(SPR[col]) return SPR[col]; const c=mk(64,64),g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32),k=hex(col);
  gr.addColorStop(0,rgba(k,1));gr.addColorStop(.25,rgba(k,.55));gr.addColorStop(.6,rgba(k,.14));gr.addColorStop(1,rgba(k,0));g.fillStyle=gr;g.fillRect(0,0,64,64);return SPR[col]=c; }
function glow(x,y,r,col,a){ if(a<=.01) return; X.globalAlpha=Math.min(1,a); X.drawImage(glowS(col),x-r,y-r,2*r,2*r); X.globalAlpha=1; }
let grainC, starC, aurC;
function mkStatic2(){
  grainC=mk(160,160); let g=grainC.getContext('2d'), id=g.createImageData(160,160); for(let i=0;i<id.data.length;i+=4){const v=R()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=16;} g.putImageData(id,0,0);
  aurC=mk(4,128); g=aurC.getContext('2d'); const gr=g.createLinearGradient(0,0,0,128); gr.addColorStop(0,'rgba(120,255,190,0)');gr.addColorStop(.35,'rgba(110,255,180,.75)');gr.addColorStop(.7,'rgba(120,140,255,.35)');gr.addColorStop(1,'rgba(140,120,255,0)'); g.fillStyle=gr; g.fillRect(0,0,4,128);
}

/* ================= geometry of the mountain ================= */
const PEAK=[[-40,1100],[-40,900],[10,850],[60,800],[104,745],[138,690],[158,620],[170,555],[184,512],[206,489],[236,481],[266,489],[284,512],[291,552],[296,584],[310,600],[332,604],[365,605],[392,618],[412,660],[440,720],[440,1100]];
const T1=x=>800+.20*x-55*Math.exp(-(((x-95)/120)**2))+5*Math.sin(x/37);
const T2=x=>1040-.17*x-50*Math.exp(-(((x-318)/120)**2))+5*Math.sin(x/41+1);
const T3=x=>1150+.17*x-55*Math.exp(-(((x-118)/120)**2))+5*Math.sin(x/33+2);
const T4=x=>1385-.17*x-50*Math.exp(-(((x-300)/120)**2))+5*Math.sin(x/45);
const T5=x=>1470+.16*x-50*Math.exp(-(((x-88)/110)**2))+4*Math.sin(x/39+3);
const T6=x=>1578+7*Math.sin(x/60);
const HILLS=[T1,T2,T3,T4,T5,T6];
const POND={x:200,y:1672,rx:118,ry:33};
// the switchback path, summit -> pond
const PATHPTS=[[240,490],[286,628],[225,705],[140,798],[215,862],[266,966],[210,1035],[168,1144],[215,1210],[256,1314],[190,1375],[136,1470],[165,1545],[200,POND.y-POND.ry-4]];
const SPUR={A:1,B:3,C:5,D:7,E:9,F:11};
let PATH=[], PLEN=[], PIDX=[];
(function(){ const p=PATHPTS, cr=(a,b,c,d,t)=>.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t);
  for(let i=0;i<p.length-1;i++){ const p0=p[Math.max(0,i-1)],p1=p[i],p2=p[i+1],p3=p[Math.min(p.length-1,i+2)]; PIDX.push(PATH.length);
    for(let j=0;j<16;j++){const t=j/16; PATH.push([cr(p0[0],p1[0],p2[0],p3[0],t),cr(p0[1],p1[1],p2[1],p3[1],t)]);} }
  PIDX.push(PATH.length); PATH.push(p[p.length-1]); let L=0; PLEN=PATH.map((pt,i)=>{ if(i) L+=Math.hypot(pt[0]-PATH[i-1][0],pt[1]-PATH[i-1][1]); return L; }); })();
function pathAt(d){ d=clamp(d,0,PLEN[PLEN.length-1]); let lo=0,hi=PLEN.length-1; while(hi-lo>1){const m=(lo+hi)>>1; if(PLEN[m]<=d) lo=m; else hi=m;}
  const t=(d-PLEN[lo])/((PLEN[hi]-PLEN[lo])||1), a=PATH[lo], b=PATH[hi]; return {x:lerp(a[0],b[0],t),y:lerp(a[1],b[1],t),dx:b[0]-a[0],dy:b[1]-a[1]}; }
const pathIdxFor = S => S>=12?13:S>=11?9:S>=10?7:S>=9?5:S>=5?3:S>=2?1:0;

/* ================= drawing kit (all take a 2d context in world units) ================= */
function smooth(c,pts){ c.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2; c.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);} const l=pts[pts.length-1]; c.lineTo(l[0],l[1]); }
function fir(c,x,base,h,seed,snow=1){
  const r=rng(seed), n=h>120?7:h>46?5:4, k=h/300, top=base-h, G=['#0e352d','#113f34','#14493a','#175241','#1a5a47','#1d624d','#216b54'], tiers=[];
  c.globalCompositeOperation='source-atop'; c.fillStyle='rgba(60,85,170,.22)'; c.beginPath(); c.ellipse(x+h*.26,base+h*.04,h*.46,h*.055,.14,0,7); c.fill(); c.globalCompositeOperation='source-over';
  c.fillStyle='#4d3222'; c.fillRect(x-8*k,base-40*k,16*k,44*k);
  for(let i=0;i<n;i++){const f=(i+1)/n; tiers.push({w:18*k+118*k*f**1.08, yt:top+(h-70*k)*(i/n)**1.05-(i?6*k:0), yb:top+(h-40*k)*f+8*k});}
  for(let i=n-1;i>=0;i--){ const {w,yt,yb}=tiers[i], m=4+Math.round(i*6/(n-1));
    c.beginPath(); c.moveTo(x,yt); c.quadraticCurveTo(x+w*.35,yt+(yb-yt)*.6,x+w,yb);
    for(let j=0;j<m;j++){const x1=x+w-2*w*(j+1)/m, xm=x+w-2*w*(j+.5)/m, dip=(6+r()*7)*k*(.6+.4*Math.abs(xm-x)/w); c.quadraticCurveTo(xm,yb-dip-((j==0||j==m-1)?10:16)*k,x1,j<m-1?yb+(r()*7-3)*k:yb);}
    c.quadraticCurveTo(x-w*.35,yt+(yb-yt)*.6,x,yt); c.fillStyle=G[Math.round(i*6/(n-1))]; c.fill();
    c.fillStyle='rgba(70,170,130,.3)'; c.beginPath(); c.moveTo(x,yt+4*k); c.quadraticCurveTo(x-w*.3,yt+(yb-yt)*.55,x-w*.9,yb-4*k); c.quadraticCurveTo(x-w*.45,yb-22*k,x-w*.2,yb-14*k); c.quadraticCurveTo(x-w*.05,yt+(yb-yt)*.5,x,yt+4*k); c.fill();
    c.fillStyle='rgba(3,20,18,.35)'; c.beginPath(); c.moveTo(x+w*.15,yb-12*k); c.quadraticCurveTo(x+w*.6,yb-24*k,x+w*.95,yb-3*k); c.quadraticCurveTo(x+w*.5,yb-8*k,x+w*.15,yb-12*k); c.fill();
    if(snow){ const sw=w*.62, sy=yt+(yb-yt)*.5; c.fillStyle='rgba(240,245,255,.95)'; c.beginPath(); c.moveTo(x,yt-1); c.quadraticCurveTo(x+sw*.4,yt+(sy-yt)*.6,x+sw,sy+4*k); c.quadraticCurveTo(x+sw*.6,sy-6*k,x+sw*.3,sy+2*k); c.quadraticCurveTo(x,sy-10*k,x-sw*.35,sy+3*k); c.quadraticCurveTo(x-sw*.7,sy-5*k,x-sw,sy+5*k); c.quadraticCurveTo(x-sw*.4,yt+(sy-yt)*.6,x,yt-1); c.fill();
      c.fillStyle='rgba(150,172,230,.6)'; c.beginPath(); c.moveTo(x+sw*.2,yt+(sy-yt)*.5); c.quadraticCurveTo(x+sw*.6,sy-4*k,x+sw,sy+4*k); c.quadraticCurveTo(x+sw*.6,sy-6*k,x+sw*.3,sy+2*k); c.fill(); }
  }
  return {tiers,top};
}
function sfir(c,x,y,h,col,col2){ c.fillStyle=col; c.beginPath(); c.moveTo(x,y-h); c.lineTo(x+h*.2,y-h*.55); c.lineTo(x+h*.1,y-h*.55); c.lineTo(x+h*.3,y-h*.2); c.lineTo(x+h*.16,y-h*.2); c.lineTo(x+h*.36,y+2); c.lineTo(x-h*.36,y+2); c.lineTo(x-h*.16,y-h*.2); c.lineTo(x-h*.3,y-h*.2); c.lineTo(x-h*.1,y-h*.55); c.lineTo(x-h*.2,y-h*.55); c.fill();
  if(col2){ c.fillStyle=col2; c.beginPath(); c.moveTo(x,y-h); c.lineTo(x-h*.2,y-h*.55); c.lineTo(x-h*.06,y-h*.6); c.lineTo(x-h*.3,y-h*.2); c.lineTo(x-h*.1,y-h*.3); c.lineTo(x,y-h*.75); c.fill(); } }
function icicles(c,x0,x1,y,r){ c.fillStyle='rgba(225,238,255,.9)'; for(let x=x0+2;x<x1-2;x+=3+r()*3){const l=2+r()*r()*8; c.beginPath(); c.moveTo(x-1.1,y); c.lineTo(x+1.1,y); c.lineTo(x,y+l); c.fill();} }
function windowAt(c,wins,cx,cy,ww,wh,o={}){ const {trim='#f3ead8',shut,arch}=o, x=cx-ww/2, y=cy-wh/2;
  if(shut){ c.fillStyle=shut; c.fillRect(x-ww*.42-1,y-1,ww*.42,wh+2); c.fillRect(x+ww+1,y-1,ww*.42,wh+2); c.fillStyle='rgba(0,0,0,.2)'; for(let k=1;k<4;k++){c.fillRect(x-ww*.42-1,y+wh*k/4,ww*.42,.7);c.fillRect(x+ww+1,y+wh*k/4,ww*.42,.7);} }
  c.fillStyle=trim; if(arch){c.beginPath();c.moveTo(x-1.5,y+wh+1.5);c.lineTo(x-1.5,y+ww/2);c.arc(cx,y+ww/2,ww/2+1.5,PI,0);c.lineTo(x+ww+1.5,y+wh+1.5);c.fill();} else c.fillRect(x-1.5,y-1.5,ww+3,wh+3);
  c.fillStyle='#1a2548'; if(arch){c.beginPath();c.moveTo(x,y+wh);c.lineTo(x,y+ww/2);c.arc(cx,y+ww/2,ww/2,PI,0);c.lineTo(x+ww,y+wh);c.fill();} else c.fillRect(x,y,ww,wh);
  c.fillStyle='rgba(150,190,255,.28)'; c.beginPath(); c.moveTo(x,y+wh*.7); c.lineTo(x+ww*.7,y+(arch?ww*.2:0)); c.lineTo(x+ww,y+(arch?ww*.4:0)); c.lineTo(x,y+wh); c.fill();
  c.fillStyle=trim; c.fillRect(cx-.6,y,1.2,wh); c.fillRect(x,cy-.6,ww,1.2); c.fillRect(x-3,y+wh+1,ww+6,2.2);
  c.strokeStyle='#fff'; c.lineWidth=2.6; c.lineCap='round'; c.beginPath(); c.moveTo(x-2,y+wh+.6); c.lineTo(x+ww+2,y+wh+.6); c.stroke();
  wins.push({x,y,w:ww,h:wh,arch,big:o.big}); }
function house(c,o){
  const {x,y,w,h,g=30,style='front',wall,roof='#3a2c3c',trim='#f3ead8',accent='#b63a34',seed=1,floors=1}=o, r=rng(seed), L=x-w/2, Rt=x+w/2, top=y-h, wins=[]; let chim=null, eave=[];
  const tot=h+g; c.globalCompositeOperation='source-atop'; c.fillStyle='rgba(60,85,170,.26)'; c.beginPath(); c.moveTo(L+4,y+1); c.lineTo(Rt,y+1); c.lineTo(Rt+tot*.62,y+tot*.2); c.lineTo(L+tot*.5,y+tot*.24); c.fill(); c.globalCompositeOperation='source-over';

      person(X,p.x,p.y-1,.6,i?'#2f7ed8':'#ffd35a',i?'#d92b2b':'#3aa66a',{col:f,flip:p.dx>=0?1:-1,noshadow:1}); if(R()<.6) sparks.push({x:p.x-p.dx*2,y:p.y,vx:-p.dx*8+R()*20-10,vy:-18-R()*18,l:1,d:2.2,c:'#ffffff',g:110,r:1.1,plain:1}); } }
  // skaters
  if(S>=12 && vis(POND.y)){ const sk=[[0,'#d92b2b','#2f7ed8',1],[2.2,'#2f7ed8','#ffd35a',1.25],[4.1,'#b455c9','#3aa66a',.8],[1.1,'#3aa66a','#f3ead8',1.1]].slice(0,S>=15?4:2);
    sk.map(([o,c1,c2,v],i)=>{ const a=t*.6*v+o, rx=POND.rx-22-i*17, ry=POND.ry-9-i*4; return {x:POND.x+rx*Math.cos(a),y:POND.y+ry*Math.sin(a),c1,c2,fl:Math.sin(a)>0?-1:1,ph:a}; }).sort((a,b)=>a.y-b.y).forEach(k=>{
      X.strokeStyle='rgba(255,255,255,.6)'; X.lineWidth=1; X.beginPath(); X.moveTo(k.x-6*k.fl,k.y+.5); X.lineTo(k.x-20*k.fl,k.y+1.2); X.stroke(); person(X,k.x,k.y,.72,k.c1,k.c2,{col:f,flip:k.fl,walk:1,ph:k.ph*3}); }); }
  X.restore();
}
function drawParticles(dt,S,hour,t){
  const dark=night>.6;
  X.save(); X.translate(0,-u);
  // wish lanterns
  if(S===20 && night>.4 && every('wish',dt,.42)) wishes.push({x:POND.x-90+R()*180,y:POND.y-20,p:R()*6,v:22+R()*16});
  wishes=wishes.filter(l=>l.y>-60); if(S!==20||night<.25) wishes=[]; X.globalCompositeOperation='lighter';
  for(const l of wishes){ l.y-=l.v*dt; l.x+=(Math.sin(t*.7+l.p)*9+3)*dt; if(l.y>u-30&&l.y<u+viewH+30){ glow(l.x,l.y,15,'#ffb45a',.7); } } X.globalCompositeOperation='source-over';
  for(const l of wishes){ if(l.y>u-30&&l.y<u+viewH+30){ X.fillStyle='#ffc35a'; X.beginPath(); X.roundRect(l.x-2.8,l.y-4.5,5.6,8,2); X.fill(); X.fillStyle='#fff3c0'; X.fillRect(l.x-1.3,l.y,2.6,2.6); } }
  // fireworks
  const fwOn=(S===21&&night>.55)||(mode==='live'&&S===22&&hour<1);
  if(fwOn && every('fw',dt,(hour>=23.9||hour<.6)?.2:.45+R()*.7)) rockets.push({x:30+R()*340,y:u+viewH+10,ty:u+viewH*(.1+R()*.5),h:R()*360});
  rockets=rockets.filter(k=>{ k.y-=520*dt; X.fillStyle='#ffe9b0'; X.beginPath(); X.arc(k.x,k.y,1.4,0,7); X.fill(); if(k.y<=k.ty){ burst(k.x,k.y,110,k.h); X.globalCompositeOperation='lighter'; glow(k.x,k.y,90,'#ffffff',.5); X.globalCompositeOperation='source-over'; if(R()<.5) burst(k.x,k.y,50,k.h+140,110); return false; } return true; });
  X.globalCompositeOperation='lighter'; sparks=sparks.filter(p=>(p.l-=dt*p.d)>0);
  for(const p of sparks){ p.vx*=1-1.4*dt; p.vy=p.vy*(1-1.4*dt)+p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; X.globalAlpha=Math.min(1,p.l*1.4)*(p.plain?.6:1); X.fillStyle=p.c; X.beginPath(); X.arc(p.x,p.y,p.r,0,7); X.fill(); }
  X.globalAlpha=1; X.globalCompositeOperation='source-over'; X.restore();
  // sky things (only near the top of the mountain)
  const so=-u*.04;
  if((S===3||S===4) && dark && every('met',dt,.5+R()*1.5)) meteors.push({x:R()*W,y:R()*330,l:1});
  meteors=meteors.filter(m=>(m.l-=dt*1.7)>0); for(const m of meteors){ m.x+=300*dt; m.y+=150*dt; const yy=m.y+so-u*.3, gr=X.createLinearGradient(m.x,yy,m.x-64,yy-32); gr.addColorStop(0,`rgba(255,255,255,${m.l})`); gr.addColorStop(1,'rgba(255,255,255,0)'); X.strokeStyle=gr; X.lineWidth=1.6; X.beginPath(); X.moveTo(m.x,yy); X.lineTo(m.x-64,yy-32); X.stroke(); }
  if(S===14 && dark){ const uu = mode==='play' ? ((hour-19.5+24)%24)/7 : ((t+3)%24)/9; if(uu>=0&&uu<=1) sleigh(moonP.x-330+uu*660, moonP.y+16-Math.sin(uu*PI)*26-u*.25, .5, t); }
  if(night<.3 && S>0){ if(!birds && every('bird',dt,14)) birds={x:-40,y:120+R()*260,v:26+R()*14}; if(birds){ birds.x+=birds.v*dt; X.strokeStyle=tc('#2a2f4a',.8); X.lineWidth=1.1; X.lineCap='round'; for(let i=0;i<6;i++){ const bx=birds.x-Math.abs(i-2.5)*11, by=birds.y+(i-2.5)*7-u*.5, fl=Math.sin(t*9+i)*2.6; X.beginPath(); X.moveTo(bx-4,by-fl); X.quadraticCurveTo(bx-1.5,by-1,bx,by); X.quadraticCurveTo(bx+1.5,by-1,bx+4,by-fl); X.stroke(); } if(birds.x>W+80) birds=null; } }
  // snow, in three depths
  flurry=Math.max(0,flurry-dt*.35); const want=Math.round((WEATHER[S]+flurry)*W*viewH/1500), du=u-lastU; lastU=u;
  while(flakes.length<want) flakes.push({x:R()*W,y:flakes.init?-6:R()*viewH,z:R(),p:R()*6}); flakes.init=1;
  X.fillStyle='#fff'; const fs=glowS('#ffffff'); for(let i=flakes.length-1;i>=0;i--){ const fl=flakes[i], rr=.5+fl.z*fl.z*2.6; fl.y+=(16+rr*15)*dt-du*(.5+fl.z*.8); fl.x+=(Math.sin(t*.9+fl.p)*9+5+fl.z*6)*dt;
    if(fl.y>viewH+8){ if(flakes.length>want){flakes.splice(i,1);continue} fl.y=-6; fl.x=R()*W; } else if(fl.y<-10){ fl.y=viewH+6; fl.x=R()*W; } if(fl.x>W+6) fl.x=-6;
    if(rr>2.2){ X.globalAlpha=.5; X.drawImage(fs,fl.x-rr*2.2,fl.y-rr*2.2,rr*4.4,rr*4.4); } else { X.globalAlpha=.45+fl.z*.5; X.beginPath(); X.arc(fl.x,fl.y,rr,0,7); X.fill(); } }
  X.globalAlpha=1;
}

/* ================= camera ================= */
let camTarget=null, camFrom=0, camT=0, camDur=1, userTouched=false;
function glideTo(y,dur=3.2){ camTarget=clamp(y-viewH*.52,0,uMax); camFrom=u; camT=0; camDur=dur; }
['wheel','touchstart','keydown','mousedown'].forEach(e=>addEventListener(e,ev=>{ if(ev.target.closest&&ev.target.closest('#dev')) return; camTarget=null; userTouched=true; $('hint').style.opacity=0; },{passive:true}));
let introAnim;
function intro(S){
  scrollTo(0,0); u=0; camTarget=null; $('cap').style.opacity=0; $('hint').style.opacity=0; if(introAnim) introAnim.cancel();
  // opens on exactly what's printed on the ornament: a circle of radius 180 world-units centred on (200,400)
  const cx=colW*.5, cy=400*s, r0=180*s, k=(colW*.43)/r0, tf=z=>`translateX(-50%) scale(${z})`; userTouched=false; cv.style.transformOrigin=`${cx}px ${cy}px`;
  const A={clipPath:`circle(${r0}px at ${cx}px ${cy}px)`,transform:tf(k)};
  introAnim=cv.animate([A,{...A,offset:.35},{clipPath:`circle(${Math.hypot(colW,ch)}px at ${cx}px ${cy}px)`,transform:tf(1)}],{duration:3800,easing:'cubic-bezier(.65,0,.25,1)',fill:'backwards'});
  introAnim.onfinish=()=>{ $('cap').style.opacity=1; if(!userTouched){ if(FOCUS[S]>viewH*.7) glideTo(FOCUS[S],3.6); else $('hint').style.opacity=.9; } };
}

/* ================= interaction ================= */
cv.addEventListener('click',e=>{ const b=cv.getBoundingClientRect(), x=(e.clientX-b.left)/s, y=(e.clientY-b.top)/s+u; flurry=Math.min(1.2,flurry+.45);
  for(let i=0;i<12;i++){const a=R()*6.283,v=20+R()*60; sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,l:1,d:1.4,c:'#ffe9a8',g:90,r:1.3});}
  const egg=LIGHTS.find(L=>L.t==='egg'); if(egg && Math.hypot(x-egg.x,y-egg.y)<16) return intro(builtStep);
  if(builtStep>=4 && Math.hypot(x-176,y-665)<34){ hop=1; poof(176,650); return; }
  if(pineInfo && Math.abs(x-236)<70 && y>280 && y<498){ party=2.2; burst(236,380,40,45,120); return; }
  for(const k in B){ const h=B[k]; if(Math.abs(x-h.x)<h.w/2+6 && y>h.y-h.h-h.g-8 && y<h.y+6){ WINS.forEach(w=>{ if(w.b===k) w.flick=1.2+R(); }); return; } }
  if(window.DeviceMotionEvent && DeviceMotionEvent.requestPermission && !cv.asked){ cv.asked=1; DeviceMotionEvent.requestPermission().catch(()=>{}); }
});
let lastA=0; addEventListener('devicemotion',e=>{ const a=e.accelerationIncludingGravity; if(!a) return; const m=Math.hypot(a.x,a.y,a.z); if(Math.abs(m-lastA)>9) flurry=1.2; lastA=m; });

/* ================= preview bar ================= */
if(preview){ $('dev').classList.add('on'); $('sSpd').value=String(spd); if($('sSpd').value!==String(spd)) $('sSpd').value='6';
  $('bPlay').onclick=()=>{ if(mode==='play'){ const c=current(); mStep=c.step; mHour=c.hour; mode='manual'; } else { const c=current(); simT=(mode==='manual'&&c.step>0&&c.step<STEPS)?(c.step-1)+15/24:15/24; mode='play'; follow=$('cFollow').checked; } };
  $('rDay').oninput=e=>{ const c=current(); mode='manual'; mStep=+e.target.value; mHour=c.hour; };
  $('rHour').oninput=e=>{ const c=current(); mode='manual'; mStep=c.step; mHour=+e.target.value; };
  $('sSpd').onchange=e=>spd=+e.target.value; $('bLive').onclick=()=>mode='live'; $('bIntro').onclick=()=>intro(builtStep); $('bHide').onclick=()=>$('dev').classList.remove('on'); $('cFollow').onchange=e=>follow=e.target.checked;
}

/* ================= main loop ================= */
let last=0, skyAt=-1e9, lastCap='', firstBuild=true;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0); last=ts; const t=ts/1000;
  if(mode==='play'){ simT+=dt/spd; if(simT>=STEPS-1+13/24){ simT=STEPS-1+13/24; mStep=STEPS; mHour=13; mode='manual'; } }
  const c=current(), S=c.step, Sdraw=Math.max(S,1);
  if(!staticBuilt){ buildStatic(); tintKey=''; }
  if(S!==builtStep){ const prev=builtStep; setSky(c.hour); buildM(S,c.year); let p=((c.live?Date.now():stepDate(Sdraw,c.year).getTime()+20*36e5)-Date.UTC(2000,0,6,18,14))/864e5/29.530588853%1; moonPhase=p<0?p+1:p; skyAt=-1e9;
    if(!firstBuild && S===prev+1){ poof(200,FOCUS[S]); if((mode==='play'&&follow)||mode==='manual') glideTo(FOCUS[S],Math.min(2.4,spd*.45)); } firstBuild=false; }
  if(mode!=='live' || ts-skyAt>4000){ setSky(c.hour); skyAt=ts; }
  // camera
  if(camTarget!=null){ camT+=dt/camDur; const k=ease(clamp(camT,0,1)); scrollTo(0,lerp(camFrom,camTarget,k)*s); if(camT>=1) camTarget=null; }
  u=clamp(scrollY/s,0,uMax); party=Math.max(0,party-dt);
  // paint
  X.setTransform(px,0,0,px,0,0); drawSky(S,c.hour,t);
  LAYERS.forEach((L,i)=>{ drawLayer(L,u*L.p); if(i===1) drawTrain(S,t,u*L.p); });
  drawLayer(Mlayer,u);
  if(S===11&&night>.6){ const g=X.createLinearGradient(0,0,0,viewH*.6); g.addColorStop(0,'rgba(90,255,170,.10)'); g.addColorStop(1,'rgba(90,255,170,0)'); X.fillStyle=g; X.fillRect(0,0,W,viewH); }
  drawActors(dt,S,c.hour,t); drawLights(S,c.hour,t);
  drawLayer(FG,u-(uMax-u)*.22);
  drawParticles(dt,S,c.hour,t);
  const vg=X.createRadialGradient(W/2,viewH*.5,viewH*.35,W/2,viewH*.5,viewH*.8); vg.addColorStop(0,'rgba(5,8,30,0)'); vg.addColorStop(1,`rgba(5,8,30,${.22+.2*night})`); X.fillStyle=vg; X.fillRect(0,0,W,viewH);
  X.setTransform(1,0,0,1,0,0); X.globalAlpha=.9; X.fillStyle=X.createPattern(grainC,'repeat'); X.fillRect(0,0,cv.width,cv.height); X.globalAlpha=1;
  // caption + preview bar
  const d = S ? (c.live?new Date():stepDate(S,c.year)).toLocaleDateString(undefined,{month:'long',day:'numeric'}) : 'Off season';
  const key=d+S; if(key!==lastCap){ lastCap=key; $('capD').textContent=d; $('capT').textContent=STORY[S]; }
  if(preview){ $('bPlay').textContent=mode==='play'?'❚❚ Pause':'▶ Time-lapse'; $('rDay').value=S; $('lDay').textContent=S?S+' · '+d:'off'; if(document.activeElement!==$('rHour')) $('rHour').value=c.hour;
    const hh=Math.floor(c.hour), mm=Math.floor((c.hour%1)*60); $('lHour').textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+(mode==='live'?' (live)':''); }
  requestAnimationFrame(frame);
}
history.scrollRestoration='manual'; mkStatic2(); fit(); scrollTo(0,0);
if(q.has('y')) setTimeout(()=>scrollTo(0,+q.get('y')*s),50);
requestAnimationFrame(frame);
if(!q.has('nointro') && mode!=='play') requestAnimationFrame(()=>requestAnimationFrame(()=>intro(current().step)));
</script>
